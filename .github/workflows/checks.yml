name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/rules.cjs
      - run: node tests/storage.cjs
      - run: node tests/release.cjs
      - run: node --check app.js
